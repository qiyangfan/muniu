version: "2"

linters:
  # standard 包含常用正确性、静态分析和未使用代码检查。
  default: standard
  enable:
    - misspell
    - revive
    - unconvert
  settings:
    revive:
      severity: warning
      rules:
        # 导出符号必须有简体中文注释；使用默认参数以兼容内置规则。
        - name: exported

formatters:
  enable:
    - gofmt
    - goimports
