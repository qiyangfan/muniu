# 样例插件构建(ADR-0011 任务 6.1,plugin-rust-sdk 起改为 workspace 全量构建):
# plugins/** 变更时构建全部插件 wasm、跑 Rust 宿主单测并上传 artifact。
# 宿主(Go)侧测试与发布不依赖 Rust 工具链——本 workflow 独立可选,失败不阻塞网关 CI。
name: plugins
on:
  push:
    branches: [main]
    paths: ["plugins/**", ".github/workflows/plugins.yml"]
  pull_request:
    paths: ["plugins/**", ".github/workflows/plugins.yml"]

concurrency:
  group: plugins-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      # 上游是 stable 分支而非 tag:钉提交保证工具链可复现,dependabot 会跟进更新
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca  #  stable 分支 @ 2026-11-15
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - name: Rust fmt check
        working-directory: plugins
        run: cargo fmt --all --check
      - name: Rust clippy (host)
        working-directory: plugins
        run: cargo clippy --workspace --all-targets -- -D warnings
      # wasm 专属代码路径(core::arch::wasm32 等)宿主目标看不到,补一遍 wasm 目标检查
      - name: Rust clippy (wasm32)
        working-directory: plugins
        run: cargo clippy --workspace --target wasm32-unknown-unknown -- -D warnings
      - name: Build plugins (workspace)
        working-directory: plugins
        run: |
          cargo build --release --target wasm32-unknown-unknown
          cp target/wasm32-unknown-unknown/release/pii_masker.wasm pii-masker/pii_masker.wasm
          cp target/wasm32-unknown-unknown/release/json_redactor.wasm json-redactor/json_redactor.wasm
      - name: Rust tests (host)
        working-directory: plugins
        run: cargo test
      # 未用依赖:clippy 不报 Cargo.toml 里多余的 dependency,cargo-machete 补这一档
      - name: Rust unused dependencies
        run: |
          VERSION=0.10.1
          curl -sSfL "https://github.com/bnjbvr/cargo-machete/releases/download/v${VERSION}/cargo-machete-v${VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | sudo tar -xz -C /usr/local/bin --strip-components=1 \
                "cargo-machete-v${VERSION}-x86_64-unknown-linux-musl/cargo-machete"
          cd plugins && cargo machete
      # 依赖策略:漏洞(RustSec)/许可证/来源/禁用项,配置单源 plugins/deny.toml;
      # 预编译二进制免去 CI 编译,版本钉死保证可复现
      - name: Rust deny
        run: |
          VERSION=0.21.0
          curl -sSfL "https://github.com/EmbarkStudios/cargo-deny/releases/download/${VERSION}/cargo-deny-${VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | tar -xz -C /tmp
          sudo mv "/tmp/cargo-deny-${VERSION}-x86_64-unknown-linux-musl/cargo-deny" /usr/local/bin/
          cd plugins && cargo deny check
      # 覆盖率走宿主单测(wasm ABI 垫片计 0%,已在本地 make plugin-check 注明);
      # 下限 68 取 2026-11-19 实测基线向下取整
      - name: Rust coverage
        run: |
          VERSION=0.9.1
          curl -sSfL "https://github.com/taiki-e/cargo-llvm-cov/releases/download/v${VERSION}/cargo-llvm-cov-x86_64-unknown-linux-gnu.tar.gz" \
            | sudo tar -xz -C /usr/local/bin cargo-llvm-cov
          rustup component add llvm-tools-preview
          cd plugins && cargo llvm-cov --workspace --summary-only --fail-under-lines 68
      # 工件仅存档用(无人消费):账号存储配额受限期间上传被拒,不应拖红整个
      # workflow;retention 缩短到 3 天,别让 90 天默认保留占账号 500MB 配额。
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        continue-on-error: true
        with:
          name: pii-masker-wasm
          path: plugins/pii-masker/pii_masker.wasm
          retention-days: 3
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        continue-on-error: true
        with:
          name: json-redactor-wasm
          path: plugins/json-redactor/json_redactor.wasm
          retention-days: 3
