# 样例插件构建(ADR-0011 任务 6.1,plugin-rust-sdk 起改为 workspace 全量构建):
# plugins/** 变更时构建全部插件 wasm、跑 Rust 宿主单测并上传 artifact。
# 宿主(Go)侧测试与发布不依赖 Rust 工具链——本 workflow 独立可选,失败不阻塞网关 CI。
name: plugins
on:
  push:
    branches: [main]
    paths: ["plugins/**", ".github/workflows/plugins.yml"]
  pull_request:
    paths: ["plugins/**", ".github/workflows/plugins.yml"]

concurrency:
  group: plugins-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # 上游是 stable 分支而非 tag:钉提交保证工具链可复现,dependabot 会跟进更新
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable 分支 @ 2026-11-15
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - name: Rust fmt check
        working-directory: plugins
        run: cargo fmt --all --check
      - name: Rust clippy
        working-directory: plugins
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build plugins (workspace)
        working-directory: plugins
        run: |
          cargo build --release --target wasm32-unknown-unknown
          cp target/wasm32-unknown-unknown/release/pii_masker.wasm pii-masker/pii_masker.wasm
          cp target/wasm32-unknown-unknown/release/json_redactor.wasm json-redactor/json_redactor.wasm
      - name: Rust tests (host)
        working-directory: plugins
        run: cargo test
      # 依赖漏洞走 RustSec 公告库:版本钉死保证可复现,有漏洞时非零退出
      - name: Rust audit
        run: |
          cargo install cargo-audit --locked --version 0.23.0
          cd plugins && cargo audit
      # 工件仅存档用(无人消费):账号存储配额受限期间上传被拒,不应拖红整个
      # workflow;retention 缩短到 3 天,别让 90 天默认保留占账号 500MB 配额。
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        continue-on-error: true
        with:
          name: pii-masker-wasm
          path: plugins/pii-masker/pii_masker.wasm
          retention-days: 3
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        continue-on-error: true
        with:
          name: json-redactor-wasm
          path: plugins/json-redactor/json_redactor.wasm
          retention-days: 3
