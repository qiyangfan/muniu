name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 增量门控:Go 侧与 web 侧互不依赖,按路径裁剪(fail-open,判定失败即全跑)。
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.filter.outputs.go }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: filter
        run: |
          set -euo pipefail
          if [ -n "${GITHUB_BASE_REF:-}" ]; then
            BASE="origin/${GITHUB_BASE_REF}"
          else
            BASE="HEAD~1"
          fi
          if ! git rev-parse -q --verify "${BASE}^{commit}" >/dev/null 2>&1; then
            echo "变更基线不可得,视为全量变更"
            echo "go=true" >> "$GITHUB_OUTPUT"
            echo "web=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          FILES=$(git diff --name-only "${BASE}...HEAD")
          echo "$FILES"
          match() { echo "$FILES" | grep -Eq "$1" && echo true || echo false; }
          # migrations/*.sql 经 go:embed 进二进制,归入 Go 侧
          echo "go=$(match '(\.go$|^go\.mod$|^go\.sum$|^internal/store/migrations/|^\.github/workflows/ci\.yml$)')" >> "$GITHUB_OUTPUT"
          echo "web=$(match '(^web/|^\.github/workflows/ci\.yml$)')" >> "$GITHUB_OUTPUT"

  check:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # 与 mise.toml 钉死的版本一致:latest 会随上游大版本漂移,门禁不可复现
          # (action 要求 v 前缀的完整版本号)
          version: "v2.15"
      # 覆盖率门禁与 make test 同式:race + atomic profile,聚合 total <65% 即红
      - name: go test (race) + coverage gate
        run: |
          go test -race -covermode=atomic -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out | awk '/^total:/ {gsub("%","",$3); if ($3+0 < 65) { printf "coverage gate FAIL: %.1f%% < 65%%\n", $3; exit 1 } printf "coverage gate PASS: %.1f%%\n", $3 }'
      - name: build (CGO_ENABLED=0)
        run: CGO_ENABLED=0 go build ./...

  web-check:
    needs: changes
    # 与 make check 的 web-check 同域:控制台 typecheck/lint 不进 CI,纯 web 改动会带着类型错误绿灯合并
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        # 版本经 web/package.json 的 packageManager 字段钉死:pnpm 9 不认识
        # pnpm-workspace.yaml 的 allowBuilds(pnpm 11 字段)会报 packages field missing;
        # action 默认只读仓库根 package.json,须显式指向 web/
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: typecheck + lint + test + format
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm lint
          pnpm lint:css
          pnpm test
          pnpm format:check
