name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      # 控制台必须先于 goreleaser 构建:go:embed 静态嵌入 dist,缺步会发布出空壳控制台的二进制
      # pnpm 版本经 web/package.json 的 packageManager 字段钉死(与本地/ci 一致);
      # action 默认只读仓库根 package.json,须显式指向 web/
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: build web dist
        run: |
          cd web && pnpm install --frozen-lockfile && pnpm build
          test -f dist/index.html # 产物校验:缺 index.html 即失败,不带占位产物发布
          # vite build 清空 dist 会连带删掉 gitignore 豁免的 .gitkeep(tracked 文件被删
          # = git 状态 dirty = goreleaser 拒发),构建后恢复占位
          [ -f dist/.gitkeep ] || touch dist/.gitkeep
      - uses: goreleaser/goreleaser-action@v7
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
