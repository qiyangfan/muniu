# 数据流级 SAST(CodeQL),与 gosec 的模式匹配互补:
# gosec 看单点危险调用,CodeQL 看跨函数的污点传播(注入/越权路径)。
name: codeql

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 每周一凌晨复查:漏洞库与查询规则更新后,既有代码也可能新暴露问题
    - cron: "0 3 * * 1"

permissions:
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language: [go, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea  # v4
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/autobuild@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea  # v4
      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea  # v4
        with:
          category: "/language:${{ matrix.language }}"
