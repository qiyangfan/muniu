#   - provider: deepseek
#     model: deepseek-reasoner
#     drop_params: [temperature, top_p]   # 不支持参数黑名单(OpenAI 形态参数名)
#     thinking_lock: true                 # 思考不可关:enable_thinking=false / reasoning_effort=minimal / thinking.type=disabled 指令被移除
#   - provider: openai
#     model: gpt-4o-mini
#     max_output_tokens: 16384            # 输出上限,越界 clamp max_tokens(界内不动)
