# 复制为 muniu.yaml 后按需修改。静态拓扑和价目存于本文件，租户、密钥和用量存于 SQLite。
# 密钥只引用环境变量，不在配置或数据库中保存明文。

server:
  addr: ":8787"
  # 三项超时均以秒为单位。
  timeouts:
    dial: 5          # TCP+TLS 建连
    first_token: 60  # 上游首个内容帧(非流式=响应首字节)
    chunk_idle: 30   # 流式相邻两帧最大间隔,超时判上游僵死

storage:
  sqlite:
    path: "data/muniu.db"   # WAL 模式;目录自动创建

log:
  level: info     # debug|info|warn|error
  format: json    # json|text

metering:
  flush_interval_ms: 500   # usage_logs 异步批量落库间隔
  flush_batch: 256         # 攒满即刷,不必等间隔
  # 1 credit = 本位币的 10^-9。
  settlement: CNY           # 本位币:CNY(缺省)|USD;价目币种 ≠ 本位币时必须配汇率
  fx_usd_cny_milli: 7200    # 1 USD = 7.200 CNY(毫单位整数);USD 报价加载期一次换算
  # local 写入本地 SQLite；ingest 推送到控制面，失败时缓冲并在恢复后续传。
  # sink: ingest
  # ingest_url: "http://control-plane:8080/internal/metering/ingest"
  # ingest_token: "..."            # 可选 Bearer,支持环境变量引用展开
  # buffer_capacity: 1000000       # 本地缓冲上限(行),超限阻塞并告警

# 可选的平台 key 配置；未设置时禁用平台 key。
# auth:
#   platform_key_secrets:          # base64 HMAC 密钥(解码后 ≥16 字节),多把支持轮换
#     - "<base64 密钥,建议经环境变量注入后展开>"
#   revocations_url: "http://control-plane:8080/internal/keys/revocations"
#   revocations_interval_sec: 60   # 吊销收敛窗口

# 可选的控制面价目与拓扑拉取；下发内容覆盖本地静态配置。
# control_plane:
#   pricing_url: "http://control-plane:8080/internal/pricing/list"
#   topology_url: "http://control-plane:8080/internal/topology"   # 拓扑热替换(providers/model_routes/能力目录)
#   poll_interval_sec: 60

# inmem 按实例计数；redis 共享限流计数，故障时降级为实例计数并告警。
# ratelimit:
#   backend: redis
#   redis_addr: "127.0.0.1:6379"

# 启用后需配置 MUNIU_ADMIN_TOKEN 才会挂载 Prometheus 指标端点 GET /metrics。
# metrics:
#   enabled: true

# 上游静态拓扑。同优先级按权重随机确定尝试顺序；本组耗尽后再降级。
# 官方端点可从 /admin/v1/provider-presets 查看；此处仅展示配置示例。
providers:
  - name: deepseek
    adapter: deepseek                     # 适配器类型(值域单源=adapter.Types()):openai=兼容基座;deepseek/moonshot/glm/qwen/doubao=基座+quirk;anthropic=桥接
                                          # 类型来自 adapter.Types()；Gemini 也可使用原生 gemini 适配器。
    base_url: "https://api.deepseek.com/v1"
    keys:
      - env: DEEPSEEK_API_KEY_1           # 只写环境变量名,绝不写明文
      # - env: DEEPSEEK_API_KEY_2         # 多 key 会组成 key 池
      #   weight: 30                       # key 权重，缺省为 1
    weight: 70
    priority: 0
  - name: openai
    adapter: openai
    base_url: "https://api.openai.com/v1"
    keys:
      - env: OPENAI_API_KEY_1
    weight: 30
    priority: 1
  # OpenAI 兼容适配器示例：
  # - name: minimax
  #   adapter: openai
  #   base_url: "https://api.minimaxi.com/v1"
  #   keys:
  #     - env: MINIMAX_API_KEY_1
  # Anthropic 兼容端点示例：请按供应商要求选择鉴权方式。
  # - name: kimi-coding
  #   adapter: anthropic
  #   auth: bearer                       # 使用 Authorization Bearer；缺省使用 x-api-key
  #   base_url: "https://api.kimi.com/coding/"
  #   keys:
  #     - env: KIMI_CODING_KEY_1
  # Gemini 原生出站示例：
  # - name: gemini-native
  #   adapter: gemini
  #   base_url: "https://generativelanguage.googleapis.com/v1beta"
  #   keys:
  #     - env: GEMINI_API_KEY
  # 仅对已验证支持 Responses API 的供应商启用原生直通；否则使用 chat 翻译。
  # - name: openai-official
  #   adapter: openai
  #   native_responses: true
  #   base_url: "https://api.openai.com/v1"
  #   keys:
  #     - env: OPENAI_API_KEY_1
  # 百炼原生多模态向量端点与兼容模式 base_url 分开配置。
  # - name: dashscope-native
  #   adapter: qwen
  #   base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
  #   native_multimodal_embeddings_url: "https://dashscope.aliyuncs.com/api/v1/services/embeddings/multimodal-embedding/multimodal-embedding"
  #   keys:
  #     - env: DASHSCOPE_API_KEY
  #   weight: 1
  #   priority: 0

# 模型路由键是入站别名；候选按 priority 顺序尝试。
model_routes:
  deepseek-chat:
    - { provider: deepseek, model: deepseek-v4-flash, priority: 0 }
  gpt-4o-mini:
    - { provider: openai, model: gpt-4o-mini, priority: 0 }
  # Anthropic 桥接适配器示例：
  # claude-sonnet:
  #   - { provider: anthropic, model: claude-sonnet-4-5, priority: 0 }
  # 百炼多模态向量只走显式声明原生 URL 的候选。
  # qwen3-vl-embedding:
  #   - { provider: dashscope-native, model: qwen3-vl-embedding, priority: 0 }
  # tongyi-embedding-vision-flash:
  #   - { provider: dashscope-native, model: tongyi-embedding-vision-flash, priority: 0 }

# 价目按每百万 token 配置，启动时转换为整数 credit 参与计费。
pricing:
  deepseek-chat:
    currency: USD
    input: 0.44        # $0.44 / 百万输入 Token(峰时,缓存未命中)
    cached_input: 0.014 # $0.014 / 百万缓存命中输入(峰时);缺省=input
    # vision_input: 0.88 # 视觉输入单价/百万 token；缺省时同 input
    output: 1.32       # $1.32 / 百万输出 Token(峰时)
    # 可选时段倍率；按声明顺序匹配，支持跨午夜。
    # timezone: "UTC"   # "UTC" 或 ±HH:MM 固定偏移(北京时间用 "+08:00");缺省 UTC
    # time_windows:
    #   - { window: "16:30-00:30", multiplier: "0.5" }   # 示例：该时段半价
    # 管理面价目会覆盖此处配置；删除覆盖后回落到静态价目。
  gpt-4o-mini:
    currency: USD
    input: 0.15        # $0.15 / 百万输入 Token
    output: 0.60       # $0.60 / 百万输出 Token

# 告警 webhook 默认关闭；通知失败不会影响请求处理。
# alerts:
#   webhook_url: "https://hooks.example.com/muniu"
#   dedup_window_sec: 300

# 渠道余额观测:按渠道声明余额源后,定时查询上游余额并外推剩余可用天数,穿越档位/阈值经
# alerts.webhook_url 告警(管理面 GET /admin/v1/balances 总览,manual 源经管理 API 录入)。
# 未声明的渠道零行为。kind 值域: none(缺省)|manual|deepseek|moonshot|
# openrouter|billing-compat(one-api/new-api 家族)|aliyun-bss|volc-bss。
# (siliconflow 不在值域:官方余额 API 已于 2026-08-14 退役且替代 API 未发布,恢复接入见 docs/design/balance-alerting.md)
# balance:
#   enabled: true                # 总开关,缺省 true;无任何渠道声明来源时整体零开销
#   eval_interval_sec: 3600      # 评估间隔
#   poll_timeout_sec: 10         # 单次上游余额查询超时
#   burn_window_days: 7          # 燃速回看窗口(天)
#   burn_min_days: 2             # 窗口内消耗天数不足时判定「数据不足」,不臆测估算
#   rearm_ratio_milli: 1200      # 告警迟滞回差(毫单位,1200=1.2 倍),低于 1000 会在触发线附近抖动
#   tier_hours: [720, 336, 168, 72, 24]   # 剩余时间档位,须严格降序;缺省 30/14/7/3/1 天
#   failure_threshold: 3         # 余额源连续失败多少次发一次运维告警
# 渠道级声明示例(挂到对应 provider 下):
#     balance:
#       source: deepseek                          # Bearer 直查族
#       below: "10.00"                            # 绝对阈值(余额币种),可选
#     balance:
#       source: manual                            # 无公开接口的渠道手动录入快照
#       currency: CNY                             # manual 必填;查询源币种由上游响应决定
#     balance:
#       source: billing-compat                    # one-api/new-api 家族聚合中转
#       currency: CNY                             # 可选;站点按人民币显示额度时必须声明(new-api 随显示配置产出 CNY 数值),缺省 USD
#     balance:
#       source: aliyun-bss                        # 云账务签名源(火山为 volc-bss)
#       access_key_env: ALIYUN_ACCESS_KEY_ID      # 只写环境变量名,建议只授账务只读权限
#       secret_key_env: ALIYUN_ACCESS_KEY_SECRET

# 语义缓存默认关闭；启用时还需打开租户开关。
# embedding_model 必须已配置在 model_routes 中。
# semantic:
#   enabled: true
#   embedding_model: deepseek-chat   # 嵌入经本网关 /v1/embeddings 通道自调用
#   dim: 1536                        # 嵌入向量维度,须与嵌入模型实际输出一致
#   threshold: 0.97                  # 余弦相似度阈值(保守起步)
#   ttl_hours: 24                    # 条目 TTL
#   capacity: 10000                  # LRU 容量上限

# 模型能力按 provider 和 model 精确声明；未声明的模型不做参数治理。
# 治理会在每次换道时按目标模型重新执行；strict_governance 可将干预改为 400 拒绝。
# models:
#   - provider: deepseek
#     model: deepseek-reasoner
#     drop_params: [temperature, top_p]   # 不支持参数黑名单(OpenAI 形态参数名)
#     thinking_lock: true                 # 思考不可关:enable_thinking=false / reasoning_effort=minimal / thinking.type=disabled 指令被移除
#   - provider: openai
#     model: gpt-4o-mini
#     max_output_tokens: 16384            # 输出上限,越界 clamp max_tokens(界内不动)
# strict_governance: false                # true = 命中约束即 400(缺省宽松放行+留痕)

