# 压测专用网关配置(T5.4):上游 = 本机假上游(scripts/bench/fake_upstream.py)
server:
  addr: "127.0.0.1:8787"
  timeouts: { dial: 2, first_token: 120, chunk_idle: 60 }
log:
  level: warn
  format: json
storage:
  sqlite:
    path: "data/bench.db"
providers:
  - name: fake
    adapter: openai
    base_url: "http://127.0.0.1:59990"
    keys: [ { env: BENCH_FAKE_KEY } ]
    weight: 10
model_routes:
  bench-alias:
    - { provider: fake, model: up-bench, priority: 0 }
pricing:
  bench-alias:
    currency: CNY
    input: "2.00"
    output: "8.00"
