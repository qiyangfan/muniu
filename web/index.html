<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover:底部标签栏经 env(safe-area-inset-bottom) 让出 iOS Home 指示条 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>muniu 控制台</title>
    <script>
      // 首帧按 localStorage、系统偏好、亮色的顺序确定主题；与 src/lib/theme.ts 保持一致。
      (function () {
        try {
          var t = localStorage.getItem("muniu-theme");
          var dark =
            t === "dark" ||
            (t !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
