# muniu API 契约单源(手写维护,T4.2):Go 侧路由必须与此处路径集合一致
# (漂移门禁:cmd/muniu/routes_test.go)。web/ 的 API 类型经 openapi-typescript 生成,禁止手写。
openapi: 3.0.3
info:
  title: muniu gateway API
  version: 0.3.0
components:
  schemas:
    Tenant:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        status: { type: string, enum: [active, disabled] }
        daily_quota_credits: { type: integer, format: int64, description: "日配额 credit(1 credit = 本位币十亿分之一);0=不限" }
        tpm_limit: { type: integer, format: int64 }
        semantic_cache_enabled: { type: boolean }
        created_at: { type: string }
    KeyRecord:
      type: object
      properties:
        id: { type: string }
        tenant_id: { type: string }
        name: { type: string }
        prefix: { type: string }
        rpm_limit: { type: integer, format: int64 }
        tpm_limit: { type: integer, format: int64, description: "0=不限" }
        daily_quota_credits: { type: integer, format: int64, description: "0=不限" }
        expires_at: { type: string, nullable: true, description: "RFC3339;null=永不过期" }
    KeyCreateRequest:
      type: object
      required: [name]
      properties:
        tenant: { type: string, description: "租户名,缺省 default" }
        name: { type: string }
        rpm_limit: { type: integer, format: int64 }
        tpm_limit: { type: integer, format: int64, description: "0=不限" }
        daily_quota_credits: { type: integer, format: int64, description: "0=不限" }
        expires_at: { type: string, description: "RFC3339;空=永不过期" }
    KeyCreateResponse:
      type: object
      description: 签发回执(字段集与 handler 实际输出一致,契约门禁双向钉死)。id 是用量 key_id 与控制面绑定的连接值,不是 secret 也不是 prefix。
      required: [key, id, prefix, tenant, rpm_limit, tpm_limit, daily_quota_credits, expires_at]
      properties:
        key: { type: string, description: "明文密钥(mk- 前缀),仅此一次返回" }
        id: { type: string, description: "Key ID(本地签发为 UUID;平台接入可为任意合法字符串)" }
        prefix: { type: string, description: "明文前 12 字符,仅辨认用" }
        tenant: { type: string, description: "租户名(按名解析落库);列表回执 KeyRecord.tenant_id 为租户 UUID——同指所属租户,值域不同,勿混用" }
        rpm_limit: { type: integer, format: int64 }
        tpm_limit: { type: integer, format: int64, description: "0=不限" }
        daily_quota_credits: { type: integer, format: int64, description: "0=不限" }
        expires_at: { type: string, nullable: true, description: "RFC3339;null=永不过期" }
    KeyPatchRequest:
      type: object
      description: 局部更新(省略字段不动;expires_at 显式 null 清除过期)
      properties:
        rpm_limit: { type: integer, format: int64 }
        tpm_limit: { type: integer, format: int64 }
        daily_quota_credits: { type: integer, format: int64, description: "日配额 credit(1 credit = 本位币十亿分之一);0=不限" }
        expires_at: { type: string, nullable: true }
    ModelEntry:
      type: object
      properties:
        id: { type: string }
        object: { type: string, enum: [model] }
        created: { type: integer, description: "拓扑快照加载时刻(unix 秒)" }
        owned_by: { type: string }
    ModelListResponse:
      type: object
      properties:
        object: { type: string, enum: [list] }
        data:
          type: array
          items: { $ref: "#/components/schemas/ModelEntry" }
    UsagePoint:
      type: object
      properties:
        dim: { type: string }
        requests: { type: integer, format: int64 }
        prompt_tokens: { type: integer, format: int64 }
        completion_tokens: { type: integer, format: int64 }
        cache_hits: { type: integer, format: int64 }
        cost_credits: { type: integer, format: int64 }
    ProviderInfo:
      type: object
      properties:
        name: { type: string }
        adapter: { type: string }
        base_url: { type: string }
        weight: { type: integer }
        priority: { type: integer }
        keys:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              weight: { type: integer }
              state: { type: string, enum: [healthy, cooldown, disabled, unknown] }
    ProviderPreset:
      type: object
      description: 单条官方端点预设(adapter/base_url/env 与 config.Provider 同轴,可逐字抄进 YAML)
      properties:
        alias: { type: string, description: "目录内唯一别名,建议直接用作 provider name" }
        display: { type: string }
        group: { type: string, enum: [domestic, global, local] }
        adapter: { type: string, description: "仅收 adapter.For 已实现集合" }
        auth: { type: string, enum: [bearer], description: "鉴权形态声明:国内 Anthropic 分支按其官方文档 AUTH_TOKEN(Bearer)口径声明;空=适配器缺省(官方 Anthropic 为 x-api-key)" }
        base_url: { type: string }
        env: { type: string, description: "建议的 key 环境变量名(约定俗成,非强制)" }
        docs: { type: string }
        models:
          type: array
          description: "典型模型(示意,以官方模型列表为准)"
          items: { type: string }
        note: { type: string, description: "接入注意事项,可空" }
    ProviderPresetListResponse:
      type: object
      properties:
        presets:
          type: array
          items: { $ref: "#/components/schemas/ProviderPreset" }
    CacheStats:
      type: object
      properties:
        enabled: { type: boolean }
        entries: { type: integer }
        hits: { type: integer }
        capacity: { type: integer }
        threshold: { type: number }
        embedding_model: { type: string }
    PricingListResponse:
      type: object
      properties:
        pricing:
          type: array
          items: { $ref: "#/components/schemas/PricingView" }
    PricingPutResponse:
      type: object
      properties:
        ok: { type: boolean }
        pricing: { $ref: "#/components/schemas/PricingView" }
    PricingDeleteResponse:
      type: object
      properties:
        ok: { type: boolean }
    PricingWindow:
      type: object
      required: [window, multiplier]
      properties:
        window: { type: string, description: "HH:MM-HH:MM;终点 24:00=当日末;start>end 为跨午夜" }
        multiplier: { type: string, description: "倍率,≤4 位小数,取值 (0,10]" }
    PricingView:
      type: object
      required: [currency, input, output]
      properties:
        alias: { type: string, readOnly: true }
        source: { type: string, enum: [db, yaml], readOnly: true, description: "db=运营覆盖 / yaml=静态兜底" }
        currency: { type: string, enum: [CNY, USD] }
        input: { type: string, description: "峰时(缺省)价,十进制 ≤9 位小数(元/百万 Token)" }
        cached_input: { type: string, description: "缓存命中价;空=缺省同 input" }
        output: { type: string }
        timezone: { type: string, description: "UTC 或 ±HH:MM 固定偏移" }
        time_windows:
          type: array
          items: { $ref: "#/components/schemas/PricingWindow" }
        updated_at: { type: string, readOnly: true }
    PluginInfo:
      type: object
      properties:
        name: { type: string }
        sha256: { type: string, description: "内容哈希固定版本" }
        enabled: { type: boolean }
        fail_open: { type: boolean, description: "true=插件失效放行原请求" }
        binary_bytes: { type: integer }
    PluginPutRequest:
      type: object
      required: [path]
      properties:
        path: { type: string, description: "wasm 二进制本地路径(服务端读取)" }
        enabled: { type: boolean, description: "新注册缺省 true;替换时沿用原状态(忽略)" }
        fail_open: { type: boolean }
        timeout_ms: { type: integer, description: "单次调用超时,0=缺省 50" }
        memory_limit_mib: { type: integer, description: "实例内存上限,0=缺省 64" }
        pool_size: { type: integer, description: "实例池,0=缺省 8" }
        config:
          type: object
          additionalProperties: { type: string }
          description: "透传插件配置(get_config 键值)"
    PluginPutResponse:
      type: object
      properties:
        name: { type: string }
        sha256: { type: string }
        enabled: { type: boolean }
        fail_open: { type: boolean }
        binary_bytes: { type: integer }
        replaced: { type: boolean, description: "true=版本替换(新请求热生效,在途请求旧版本完成)" }
paths:
  /healthz:
    get:
      summary: 存活探针
      responses:
        "200": { description: 服务健康 }
  /v1/chat/completions:
    post:
      summary: OpenAI 兼容对话补全(支持 SSE 流式)
      parameters:
        - { name: Authorization, in: header, required: true, schema: { type: string } }
      responses:
        "200": { description: 补全结果(非流式 JSON / 流式 SSE) }
        "4XX": { description: 归一化错误信封 }
  /v1/embeddings:
    post:
      summary: OpenAI 兼容 embeddings 透传
      parameters:
        - { name: Authorization, in: header, required: true, schema: { type: string } }
      responses:
        "200": { description: 嵌入向量 }
  /v1/responses:
    post:
      summary: OpenAI Responses API 入站(无状态翻译 v1,ADR-0012;鉴权/配额/限流与 chat 同规)
      parameters:
        - { name: Authorization, in: header, required: true, schema: { type: string } }
      responses:
        "200": { description: 非流式 response 对象 / 流式 SSE 事件集 }
        "400": { description: previous_response_id_unsupported / background_unsupported / input_item_unsupported / input_invalid }
        "4XX": { description: 归一化错误信封 }
  /v1/messages:
    post:
      summary: Anthropic Messages 入站(ADR-0013;边缘翻译为 chat 后进同一管道,鉴权/配额/限流同规;x-api-key 与 Bearer 双形态)
      parameters:
        - { name: X-Api-Key, in: header, required: false, schema: { type: string }, description: "Anthropic 形态 key;与 Authorization Bearer 二选一" }
      responses:
        "200": { description: 非流式 message 对象 / 流式 message_start→content_block_*→message_delta→message_stop 事件序列 }
        "400": { description: content_block_unsupported / 请求不符合 Messages 格式(Anthropic error JSON) }
        "4XX": { description: 鉴权/限流错误(成功路径 Anthropic 形态;错误信封形态见设计文档登记) }
  /v1beta/models/{modelMethod}:
    post:
      summary: "Gemini 原生入站(ADR-0015;边缘翻译为 chat 后进同一管道;{modelMethod} = {model}:generateContent | {model}:streamGenerateContent?alt=sse)"
      parameters:
        - { name: modelMethod, in: path, required: true, schema: { type: string }, description: "{model}:{method} 整段(冒号连接)" }
        - { name: X-Goog-Api-Key, in: header, required: false, schema: { type: string }, description: "Gemini 形态 key;与 Authorization Bearer / ?key= 三选一(?key= 读后剥离)" }
      responses:
        "200": { description: 非流式 GenerateContentResponse / 流式 alt=sse 增量帧→终帧(finishReason+usageMetadata) }
        "400": { description: content_part_unsupported / stream_form_unsupported / input_invalid(Gemini error 信封) }
        "4XX": { description: 鉴权/限流错误(信封为 Gemini error 形态,SDK error.message 可读) }
  /v1/responses/{id}:
    get:
      summary: 亲和已知代理转发(ADR-0014 粘性路由)/ 未知恒 404 自解释
      parameters:
        - { name: Authorization, in: header, required: true, schema: { type: string } }
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "404": { description: not_found 信封(恒定) }
  /v1/models:
    get:
      summary: 模型发现(别名目录,与转发拓扑同源;鉴权同数据面,不消耗配额/限流、不计量)
      parameters:
        - { name: Authorization, in: header, required: true, schema: { type: string } }
      responses:
        "200":
          description: OpenAI list 形态,条目=拓扑快照 model_routes 别名键集(id 升序)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelListResponse" }
        "401": { description: 未鉴权 }
  /v1/models/{model}:
    get:
      summary: 单模型查询(按别名=路由键判定)
      parameters:
        - { name: Authorization, in: header, required: true, schema: { type: string } }
        - { name: model, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: 单模型对象
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelEntry" }
        "404": { description: not_found/model_not_found 信封 }
  /admin/v1/tenants:
    get:
      summary: 租户列表
      responses:
        "200": { description: 租户数组 }
    post:
      summary: 创建租户
      responses:
        "200": { description: 租户 id }
  /admin/v1/tenants/{id}:
    patch:
      summary: 更新租户(状态/配额/缓存开关)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: 已更新 }
  /admin/v1/keys:
    get:
      summary: key 列表
      responses:
        "200": { description: key 数组(无明文) }
    post:
      summary: 签发 key(明文仅此一次返回;限额/过期字段缺省=不限/永不过期)
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KeyCreateRequest" }
      responses:
        "200":
          description: 明文 key 与回执
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KeyCreateResponse" }
  /admin/v1/keys/{id}:
    patch:
      summary: key 运行态限额局部更新(写后鉴权缓存立即失效,下一请求即新限额)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KeyPatchRequest" }
      responses:
        "200": { description: 更新后的 key 回执 }
        "404": { description: key 不存在 }
        "400": { description: 非法值(负限额/expires_at 非 RFC3339) }
  /admin/v1/keys/{prefix}:
    delete:
      summary: 吊销 key
      parameters:
        - { name: prefix, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: 已吊销 }
  /admin/v1/usage:
    get:
      summary: usage 聚合(按日/按 key/按模型/按 provider)
      parameters:
        - { name: group_by, in: query, required: true, schema: { type: string, enum: [day, key, model, provider] } }
        - { name: from, in: query, schema: { type: string } }
        - { name: to, in: query, schema: { type: string } }
        - { name: tenant_id, in: query, schema: { type: string } }
        - { name: key_id, in: query, schema: { type: string } }
      responses:
        "200": { description: 聚合点数组 }
  /admin/v1/providers:
    get:
      summary: 供应商拓扑与 key 池实时状态(只读)
      responses:
        "200": { description: 供应商数组 }
  /admin/v1/provider-presets:
    get:
      summary: 官方端点预设目录(内置只读参考数据,复制 YAML 片段即可接入;收录标准见 upstream-adapters「官方端点预设目录」)
      responses:
        "200":
          description: 预设条目数组(presets 包装键)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProviderPresetListResponse" }
  /admin/v1/cache/stats:
    get:
      summary: 语义缓存统计
      responses:
        "200": { description: 命中率/条数/开关状态 }
  /admin/v1/pricing:
    get:
      summary: 价目列表(source=db 运营覆盖含时段窗 / yaml 静态兜底缺省价)
      responses:
        "200":
          description: 价目条目数组(pricing 包装键)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PricingListResponse" }
  /admin/v1/pricing/{alias}:
    put:
      summary: 在线改价(运行态覆盖,持久化+即时生效零重启;对 yaml 别名即建覆盖)
      parameters:
        - { name: alias, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PricingView" }
      responses:
        "200":
          description: 已生效(返回落库条目)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PricingPutResponse" }
        "400": { description: 校验失败(整单拒绝) }
    delete:
      summary: 撤销运行态覆盖(该别名回落 YAML 静态兜底)
      parameters:
        - { name: alias, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: 已撤销
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PricingDeleteResponse" }
        "404": { description: 无运行态覆盖 }
  /admin/v1/plugins:
    get:
      summary: 插件列表(含停用;SHA-256 固定版本)
      responses:
        "200":
          description: 插件数组(plugins 包装键)
          content:
            application/json:
              schema:
                type: object
                properties:
                  plugins:
                    type: array
                    items: { $ref: "#/components/schemas/PluginInfo" }
  /admin/v1/plugins/{name}:
    put:
      summary: 注册插件/版本替换(注册即校验 wasm magic→编译→ABI 版本→plugin_start;失败拒载)
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PluginPutRequest" }
      responses:
        "200":
          description: 已生效(replaced=true 为热替换,新请求走新版本,在途请求旧版本完成)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PluginPutResponse" }
        "400": { description: 拒载(非 wasm/ABI 不匹配/plugin_start 失败)或文件不可读 }
    patch:
      summary: 插件启停(停用后主路径零开销)
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        "200": { description: 已切换 }
        "404": { description: 插件不存在 }
