# longzhong 控制面 wire v1（X-01 冻结版，muniu 消费档案）
# 状态：以锦官 src/main/resources/contracts/control-plane 为单一来源；本文件只登记
# muniu 消费的端点、信封与必填字段，不再另立第二套提案。字段/方向变化先改锦官契约。
# 变更纪律见 docs/design/control-plane-client.md。
openapi: 3.1.0
info:
  title: longzhong control-plane wire (muniu consumer profile)
  version: "1"
  description: |
    muniu 作为数据面消费锦官共享控制所需的最小 wire 契约。所有时间均为 RFC3339 UTC。
    快照签名是响应体裸签名，算法 RSA-SHA256 PKCS#1 v1.5，签名在响应头。
x-service-id: muniu
x-proposal-status: frozen-jinguan-x01
x-signature-header: X-Jinguan-Signature
x-signature:
  algorithm: RSA-SHA256
  padding: PKCS1v15
  encoding: base64
  covers: raw_response_body
security:
  - serviceBearer: []
paths:
  /control/v1/snapshot:
    get:
      summary: 统一控制快照（条件请求 + 裸签名）
      parameters:
        - {name: If-None-Match, in: header, required: false, schema: {type: string}}
      responses:
        "200":
          description: 新快照；响应体整体签名
          headers:
            ETag: {schema: {type: string}}
            X-Jinguan-Signature: {schema: {type: string}}
            X-Jinguan-Key-Id: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SnapshotEnvelope"}
        "304":
          description: 未变更；视为控制面可达
  /control/v1/registry/register:
    post:
      summary: 幂等注册实例（不含 endpoint/凭据）
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RegistrationRequest"}
      responses:
        "2XX": {description: 已注册}
  /control/v1/registry/heartbeat:
    post:
      summary: 心跳；只刷新实例 last_seen
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/HeartbeatRequest"}
      responses:
        "2XX": {description: 已接收}
  /ingest/health:
    post:
      summary: 健康事件；真实探针状态，不伪造 UP
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/HealthEvent"}
      responses:
        "2XX": {description: 已接收}
  /ingest/usage:
    post:
      summary: muniu LLM 用量批量上报（历史已登记管子，行主键幂等）
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/UsageIngest"}
      responses:
        "2XX": {description: 已接收}
  /control/v1/commands/claim:
    post:
      summary: 认领跨服务命令（有限动作枚举）
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ClaimRequest"}
      responses:
        "200":
          description: command-envelope 数组
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/WireCommand"}
  /control/v1/commands/{command_id}/ack:
    post:
      summary: 命令终态回执
      parameters:
        - {name: command_id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AckRequest"}
      responses:
        "2XX": {description: 已记录}
components:
  securitySchemes:
    serviceBearer:
      type: http
      scheme: bearer
      description: 服务身份；Keycloak client_credentials 或仅 loopback 的 pre-shared token
  schemas:
    SnapshotEnvelope:
      type: object
      required: [version, observed_at, service_id, etag, security_sections, sections]
      properties:
        version: {type: integer, minimum: 1}
        observed_at: {type: string, format: date-time}
        service_id: {type: string, enum: [kongming, muniu]}
        etag: {type: string}
        security_sections:
          type: array
          items: {type: string}
        sections: {type: object}
    SnapshotSections:
      type: object
      required: [tenant_directory, entitlements, policy_packages, key_revocations]
      properties:
        tenant_directory: {type: object}
        # muniu 解释 entitlements.quotas 的 rpm/tpm/daily_quota_credits/max_inflight;
        # max_inflight 缺席=本地缺省,0=不限。
        entitlements: {type: object}
        policy_packages: {type: object}
        pricing: {type: object}
        topology: {type: object}
        key_revocations: {type: object}
    RegistrationRequest:
      type: object
      required: [serviceId, instanceId, environment, version]
      properties:
        serviceId: {type: string, enum: [kongming, muniu]}
        instanceId: {type: string}
        environment: {type: string}
        version: {type: string}
        capabilities: {type: array, items: {type: string}}
        adminCapabilities: {type: array, items: {type: string}}
    HeartbeatRequest:
      type: object
      required: [serviceId, instanceId]
      properties:
        serviceId: {type: string, enum: [kongming, muniu]}
        instanceId: {type: string}
    HealthEvent:
      type: object
      required: [serviceId, instanceId, status, observedAt]
      properties:
        serviceId: {type: string, enum: [kongming, muniu]}
        instanceId: {type: string}
        status: {type: string, enum: [UP, DEGRADED]}
        observedAt: {type: string, format: date-time}
    UsageIngest:
      type: object
      required: [source, schema_version, rows]
      properties:
        source: {type: string, enum: [muniu]}
        schema_version: {type: integer}
        rows: {type: array, items: {type: object}}
    ClaimRequest:
      type: object
      properties:
        limit: {type: integer, minimum: 1}
    WireCommand:
      type: object
      required:
        [id, serviceId, action, actionSchemaVersion, params, reason, actor, status, attempts,
         maxAttempts, createdAt, updatedAt]
      properties:
        id: {type: string}
        serviceId: {type: string}
        action: {type: string}
        actionSchemaVersion: {type: integer}
        params: {type: object}
        reason: {type: string}
        actor: {type: string}
        status: {type: string}
        attempts: {type: integer}
        maxAttempts: {type: integer}
        claimedBy: {type: string}
        result: {type: object}
        error: {type: string}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        finishedAt: {type: string, format: date-time}
    AckRequest:
      type: object
      required: [status]
      properties:
        status: {type: string, enum: [SUCCEEDED, FAILED]}
        result: {type: object}
        error: {type: string}
