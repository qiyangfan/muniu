# muniu cluster 形态 LB 配置(参考样例):nginx 轮询 upstream
# SSE 三件套缺一不可:清空 Connection 头保持长连接 / proxy_buffering off 逐事件透传 /
# proxy_read_timeout 拉长覆盖慢流(muniu 自身 first_token/chunk_idle 超时在其上游)。
events {}
http {
  upstream muniu {
    server muniu-a:8787;
    server muniu-b:8787;
  }
  server {
    listen 8787;
    location / {
      proxy_pass http://muniu;
      proxy_http_version 1.1;
      proxy_set_header Connection "";       # SSE 必需:清空 Connection 头保持长连接
      proxy_buffering off;                   # SSE 逐事件透传,LB 不得攒包
      proxy_read_timeout 600s;               # 长流式响应
    }
  }
}
