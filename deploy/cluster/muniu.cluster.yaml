# 集群配置示例：价目、拓扑、密钥吊销和计量均通过控制面同步。
# 控制面不可达时保留当前拓扑快照，网关继续处理请求。

server:
  addr: ":8787"
  timeouts:
    dial: 5
    first_token: 60
    chunk_idle: 30

storage:
  sqlite:
    path: "data/muniu.db"   # 副本本地仅计量缓冲(可重放可丢弃)

log:
  level: info
  format: json

metering:
  flush_interval_ms: 500
  flush_batch: 256
  settlement: CNY
  fx_usd_cny_milli: 7200
  sink: control                                           # 双写本地 + 锦官;失败落本地缓冲,恢复按序续传
  buffer_capacity: 1000000

auth:
  platform_key_secrets:                                   # base64 HMAC 密钥,建议环境变量注入后展开
    - "${MUNIU_PLATFORM_KEY_SECRET}"

control_plane:
  mode: managed
  base_url: "http://control-plane:8090"
  # instance_id 缺省 hostname-pid(容器/pod 名天然区分副本)
  token_url: "http://keycloak:8080/realms/longzhong/protocol/openid-connect/token"
  client_id: "muniu-control"
  client_secret: "${MUNIU_CONTROL_CLIENT_SECRET}"
  snapshot_jwks_url: "http://jinguan:8090/.well-known/jwks.json"  # 空=由 base_url 派生
  # 可选离线 pin（配置后不跟随锦官轮换）：snapshot_public_key_file: "/etc/muniu/control-signing.pem"
  poll_interval_sec: 60
  heartbeat_interval_sec: 30
  command_poll_interval_sec: 15
  request_timeout_sec: 10

service_api:
  issuer: "http://keycloak:8080/realms/longzhong"         # 供锦官只读投影
  clients: ["jinguan-read-muniu"]
  # 本地回环演练才用 token；生产不配置 pre-shared
  # token: "${MUNIU_SERVICE_READ_TOKEN}"

ratelimit:
  backend: redis                        # 共享视图(cluster 形态,ADR-0008 修订):×N 消除
  redis_addr: "redis:6379"              # 后端不可达各副本自动降级实例自治并告警,恢复自动回共享视图

metrics:
  enabled: true

# ── 以下静态拓扑为启动兜底(控制面缺席时副本以它起服;首个快照周期即被锦官拓扑
#    热替换)。managed 下日常拓扑/价目运营走锦官,本段仅作启动兜底;上游 key 走环境变量。
providers:
  - name: deepseek
    adapter: deepseek
    base_url: "https://api.deepseek.com/v1"
    keys:
      - env: DEEPSEEK_API_KEY_1
    weight: 100
    priority: 0

model_routes:
  deepseek-chat:
    - { provider: deepseek, model: deepseek-v4-flash, priority: 0 }

pricing:
  deepseek-chat:
    currency: USD
    input: 0.44
    cached_input: 0.014
    output: 1.32
