# muniu cluster 形态参考部署(6.1)——参考样例而非生产清单
# 两副本 muniu(无状态)+ nginx 轮询 LB + 控制面(锦官)。
# 用法:本目录放好 .env(DEEPSEEK_API_KEY_1 / MUNIU_ADMIN_TOKEN / JINGUAN_INGEST_TOKEN /
# MUNIU_PLATFORM_KEY_SECRET)后
#   podman compose -f docker-compose.cluster.yml up -d
# 镜像:ghcr 路径为占位——以两仓实际发布渠道为准;本地构建用根 Containerfile
# (muniu:podman build -t muniu .;锦官:见其 delivery-pipeline 的 Dockerfile)。
services:
  lb:
    image: docker.io/library/nginx:alpine
    ports:
      - "8787:8787"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on: [muniu-a, muniu-b]

  redis:                                            # 限流共享视图(ADR-0008 修订):
    image: docker.io/library/redis:8-alpine         # RPM/TPM 共享计数,消除 ×N;不可达各副本降级实例自治并告警
    # redis 仅承载限流计数器(可丢失可重建),不持久化、不做主从——down 不丢计量数据

  muniu-a: &muniu
    image: ghcr.io/qiyangfan/muniu:v0.3.0          # 占位:本地构建或替换为实际发布镜像
    environment:
      - DEEPSEEK_API_KEY_1=${DEEPSEEK_API_KEY_1}    # 上游 key 全副本同源,健康度各自独立观测
      - MUNIU_ADMIN_TOKEN=${MUNIU_ADMIN_TOKEN}
      - JINGUAN_INGEST_TOKEN=${JINGUAN_INGEST_TOKEN}
      - MUNIU_PLATFORM_KEY_SECRET=${MUNIU_PLATFORM_KEY_SECRET}  # yaml ${VAR} 展开引用,缺失即 fail-fast 拒启
    volumes:
      - ./muniu.cluster.yaml:/muniu.yaml:ro         # 控制面 URL 全指向锦官(见本文件)
    depends_on: [redis]
    # 副本本地 SQLite 仅承载计量缓冲(可重放可丢弃);生产建议挂本地盘而非共享卷
  muniu-b:
    <<: *muniu

  control-plane:                                    # 锦官(或任意实现同契约端点的控制面)
    image: ghcr.io/qiyangfan/jinguan:latest         # 占位:本地构建或替换为实际发布镜像
    ports:
      - "8090:8090"
    environment:
      - JINGUAN_INGEST_TOKEN=${JINGUAN_INGEST_TOKEN}
