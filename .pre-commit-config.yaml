# 提交期门禁:凭据、文件卫生与提交信息规范。CI 以 `pre-commit run --all-files` 兜底同一配置
# (gitleaks 在 security.yml 做全历史扫描,CI 内以 SKIP=gitleaks 避免重复)。
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  # 文件卫生:对齐 .editorconfig 的换行/尾随空白/EOF 规则,
  # 并给根与 deploy/ 下的 YAML/JSON 一个语法闸(actionlint 只覆盖 workflow)。
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # 多文档 YAML(pnpm-lock、k8s 清单)是合法形态
      - id: check-yaml
        args: [--allow-multiple-documents]
      # 20260910-033854 批为零字节的运行失败产物(非 JSON),历史证据不删不改
      - id: check-json
        exclude: ^docs/benchmarks/raw-20260910-033854/
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: check-executables-have-shebangs
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
        args: [--fix=lf]
  - repo: local
    hooks:
      - id: commit-msg-convention
        name: "提交信息规范(type(scope): 描述)"
        entry: scripts/commitcheck.sh --file
        language: script
        stages: [commit-msg]
