[package]
name = "pii-masker"
version = "0.1.0"
edition = "2021"
description = "muniu 样例 WASM 插件:请求载荷 PII 脱敏(正则规则,可热替换;ABI v0;目标 wasm32-unknown-unknown)"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[profile.release]
panic = "abort"   # wasm 无 unwind;abort 兑现「错误即 trap 即 containment」
opt-level = "s"
strip = true
